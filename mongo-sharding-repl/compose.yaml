name: mongo-sharding-repl
services:
  # ============================================
  # CONFIG SERVERS (Replica Set)
  # ============================================
  config1:
    container_name: config1
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27017:27017"
    networks:
      app-network:
        ipv4_address: 173.17.0.10
    volumes:
      - config1_data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  config2:
    container_name: config2
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27018:27018"
    networks:
      app-network:
        ipv4_address: 173.17.0.11
    volumes:
      - config2_data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27018"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  config3:
    container_name: config3
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27019:27019"
    networks:
      app-network:
        ipv4_address: 173.17.0.12
    volumes:
      - config3_data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27019"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # ============================================
  # SHARD 1 (Replica Set with 3 nodes)
  # ============================================
  shard1_primary:
    container_name: shard1_primary
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27020:27020"
    networks:
      app-network:
        ipv4_address: 173.17.0.20
    volumes:
      - shard1_primary_data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
        "--port",
        "27020"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard1_secondary1:
    container_name: shard1_secondary1
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27021:27021"
    networks:
      app-network:
        ipv4_address: 173.17.0.21
    volumes:
      - shard1_secondary1_data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
        "--port",
        "27021"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard1_secondary2:
    container_name: shard1_secondary2
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27022:27022"
    networks:
      app-network:
        ipv4_address: 173.17.0.22
    volumes:
      - shard1_secondary2_data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
        "--port",
        "27022"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # ============================================
  # SHARD 2 (Replica Set with 3 nodes)
  # ============================================
  shard2_primary:
    container_name: shard2_primary
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27023:27023"
    networks:
      app-network:
        ipv4_address: 173.17.0.30
    volumes:
      - shard2_primary_data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
        "--port",
        "27023"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard2_secondary1:
    container_name: shard2_secondary1
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27024:27024"
    networks:
      app-network:
        ipv4_address: 173.17.0.31
    volumes:
      - shard2_secondary1_data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
        "--port",
        "27024"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard2_secondary2:
    container_name: shard2_secondary2
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27025:27025"
    networks:
      app-network:
        ipv4_address: 173.17.0.32
    volumes:
      - shard2_secondary2_data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
        "--port",
        "27025"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # ============================================
  # MONGOS ROUTERS
  # ============================================
  mongos1:
    container_name: mongos1
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27026:27026"
    networks:
      app-network:
        ipv4_address: 173.17.0.40
    command:
      [
        "mongos",
        "--configdb",
        "config_server/config1:27017,config2:27018,config3:27019",
        "--bind_ip_all",
        "--port",
        "27026"
      ]
    depends_on:
      - config1
      - config2
      - config3
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  mongos2:
    container_name: mongos2
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27027:27027"
    networks:
      app-network:
        ipv4_address: 173.17.0.41
    command:
      [
        "mongos",
        "--configdb",
        "config_server/config1:27017,config2:27018,config3:27019",
        "--bind_ip_all",
        "--port",
        "27027"
      ]
    depends_on:
      - config1
      - config2
      - config3
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # ============================================
  # API INSTANCES
  # ============================================
  pymongo_api_1:
    container_name: pymongo_api_1
    build:
      context: api_app
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:8080"
    networks:
      app-network:
        ipv4_address: 173.17.0.60
    environment:
      MONGODB_URL: "mongodb://mongos1:27026"
      MONGODB_DATABASE_NAME: "somedb"
    depends_on:
      - mongos1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      start_period: 10s

  pymongo_api_2:
    container_name: pymongo_api_2
    build:
      context: api_app
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8082:8080"
    networks:
      app-network:
        ipv4_address: 173.17.0.61
    environment:
      MONGODB_URL: "mongodb://mongos1:27026"
      MONGODB_DATABASE_NAME: "somedb"
    depends_on:
      - mongos1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      start_period: 10s

  pymongo_api_3:
    container_name: pymongo_api_3
    build:
      context: api_app
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8083:8080"
    networks:
      app-network:
        ipv4_address: 173.17.0.62
    environment:
      MONGODB_URL: "mongodb://mongos1:27026"
      MONGODB_DATABASE_NAME: "somedb"
    depends_on:
      - mongos1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      start_period: 10s

  # ============================================
  # LOAD BALANCER (Nginx)
  # ============================================
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: always
    ports:
      - "8080:80"
    networks:
      app-network:
        ipv4_address: 173.17.0.70
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pymongo_api_1
      - pymongo_api_2
      - pymongo_api_3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      start_period: 10s

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.17.0.0/16

volumes:
  # Config Servers
  config1_data:
  config2_data:
  config3_data:
  # Shard 1
  shard1_primary_data:
  shard1_secondary1_data:
  shard1_secondary2_data:
  # Shard 2
  shard2_primary_data:
  shard2_secondary1_data:
  shard2_secondary2_data:
